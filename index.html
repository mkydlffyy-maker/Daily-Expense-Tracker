
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Daily Expense Tracker</h1>
        <p class="subtitle">Uang ke mana aja, sih? Yuk, cek pengeluaranmu!</p>

        <div class="budget-section">
            <label for="budget">Budget Hari ini? (Rp)</label>
            <div class="budget-input">
                <input type="number" id="budget" placeholder="Contoh: 50000" min="0">
                <button id="saveBudget">Simpan</button>
            </div>
        </div>

        <div class="summary">
            <div class="summary-card">
                <p>Budget Hari Ini</p>
                <h3 id="totalBudget">Rp0</h3>
            </div>

            <div class="summary-card">
                <p>Total Pengeluaran</p>
                <h3 id="totalExpense">Rp0</h3>
            </div>

            <div class="summary-card">
                <p>Sisa Uang</p>
                <h3 id="remainingMoney">Rp0</h3>
            </div>
        </div>

        <div class="form-section">
            <h2>Tambah Pengeluaran</h2>

            <form id="expenseForm">
                <label for="expenseName">Buat Apa Nih?</label>
                <input type="text" id="expenseName"
                    placeholder="Contoh: Makan siang" required>

                <label for="category">Kategori</label>
                <select id="category" required>
                    <option value="">Pilih kategori</option>
                    <option value="Makanan">Makanan</option>
                    <option value="Transportasi">Transportasi</option>
                    <option value="Pendidikan">Pendidikan</option>
                    <option value="Hiburan">Hiburan</option>
                    <option value="Lainnya">Lainnya</option>
                </select>

                <label for="amount">Nominal (Rp)</label>
                <input type="number" id="amount"
                    placeholder="Contoh: 15000" min="1" required>

                <button type="submit" class="add-button">
                    Tambah Pengeluaran
                </button>
            </form>
        </div>

        <div class="expense-section">
            <h2>Daftar Pengeluaran</h2>

            <ul id="expenseList">
                <li class="empty-message">Belum ada pengeluaran</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
